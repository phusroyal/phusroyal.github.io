<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BlueDot Q3 Manifold Sampler</title>
    <link rel="stylesheet" href="{{ '/assets/css/beyond.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/bluedot-q3.css' | relative_url }}">
    <style>
        body {
            margin: 0;
            min-width: 0;
        }

        .q3-figure {
            margin: 0 !important;
        }

        .q3-figure-header {
            align-items: center !important;
            display: flex !important;
            flex-wrap: nowrap !important;
            gap: .5rem !important;
            padding: .65rem .75rem 0 !important;
        }

        .q3-figure-header > div:first-child {
            flex: 1;
            min-width: 0 !important;
        }

        .q3-figure-intro {
            font-size: .8rem;
            line-height: 1.3;
        }

        .q3-controls {
            flex-shrink: 0;
            margin: 0 !important;
        }

        .q3-controls button {
            font-size: .72rem;
            padding: .3rem .48rem;
        }

        .q3-canvas-grid {
            display: grid !important;
            gap: .5rem !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            margin: .65rem .75rem 0 !important;
            min-height: 0 !important;
        }

        .q3-panel {
            padding: .3rem !important;
        }

        .q3-panel h4 {
            font-size: .76rem;
            margin: 0 0 .15rem !important;
        }

        .q3-panel canvas {
            height: 160px !important;
        }

        .q3-figure figcaption {
            font-size: .76rem;
            line-height: 1.35;
            margin-top: .65rem !important;
            padding: .55rem .75rem !important;
        }

        .q3-caption-guide {
            display: none;
        }

        @media (max-width: 28rem) {
            .q3-figure-header {
                align-items: flex-start !important;
                flex-wrap: wrap !important;
            }

            .q3-canvas-grid {
                grid-template-columns: 1fr !important;
            }

            .q3-panel canvas {
                height: 180px !important;
            }
        }
    </style>
</head>
<body>
    <figure class="q3-figure" data-q3-figure="sampler" data-q3-src="{{ '/assets/data/writing/bluedot-puzzle-1/q3/manifolds.json' | relative_url }}">
        <div class="q3-figure-header">
            <div>
                <p class="article-figure-label">Figure 1 · Chosen manifold sampler</p>
                <p class="q3-figure-intro">The target distributions are specified before the model sees an example.</p>
            </div>
            <div class="q3-controls" aria-label="Manifold projection">
                <button type="button" data-q3-projection="3d" aria-pressed="true">3D</button>
                <button type="button" data-q3-projection="xy" aria-pressed="false">XY</button>
                <button type="button" data-q3-projection="xz" aria-pressed="false">XZ</button>
            </div>
        </div>
        <div class="q3-canvas-grid" data-q3-canvas role="group" aria-label="Interactive sphere-shell and helix-tube target manifolds">
            <p class="q3-chart-status" data-q3-status>Loading target manifolds…</p>
        </div>
        <div class="q3-fallback q3-fallback-pair">
            <img src="{{ '/assets/images/writing/bluedot-puzzle-1/q3/sphere_shell-xy.png' | relative_url }}" alt="Static sphere-shell target distribution.">
            <img src="{{ '/assets/images/writing/bluedot-puzzle-1/q3/helix_tube-xy.png' | relative_url }}" alt="Static helix-tube target distribution.">
        </div>
        <figcaption>
            <span class="q3-caption-finding">Both classes share each manifold; country is represented by inner radius rather than a global direction.</span>
            <span class="q3-caption-guide">Drag either panel to rotate it, or switch to a shared XY or XZ projection.</span>
        </figcaption>
    </figure>
    <script src="{{ '/assets/js/bluedot-q3.js' | relative_url }}"></script>
</body>
</html>
